<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f12" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
    <meta name="description" content="A clickable knowledge map of Ethereum RPC: every topic explained precisely, every new term its own leaf.">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <title>Ethereum RPC — knowledge map</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#lesson">Skip to lesson</a>
    <div class="app-shell">
      <header class="topbar">
        <button id="brand-button" class="brand-lockup" type="button" title="Back to the start">
          <span class="brand-mark" aria-hidden="true">◈</span>
          <span class="brand-text">
            <span class="eyebrow">Knowledge map</span>
            <span class="brand-title">Ethereum <em>RPC</em></span>
          </span>
        </button>

        <div class="search-wrap">
          <label class="search-box" for="topic-search">
            <span aria-hidden="true">⌕</span>
            <input id="topic-search" type="search" placeholder="Search topics, methods, EIPs…" autocomplete="off" aria-label="Search topics" aria-controls="search-results" aria-expanded="false">
            <kbd>/</kbd>
          </label>
          <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
        </div>

        <div class="topbar-actions">
          <div class="view-toggle" role="group" aria-label="Map view">
            <button type="button" class="view-button is-active" data-view="focus" title="Current topic with its terms as branches and leaves">Focus</button>
            <button type="button" class="view-button" data-view="overview" title="Every topic, grouped by category">Overview</button>
          </div>
          <div class="progress-wrap" aria-label="Learning progress" title="Topics marked as learned">
            <div class="progress-label"><span>Learned</span><strong id="progress-count">0 / 0</strong></div>
            <div class="progress-track"><span id="progress-bar"></span></div>
          </div>
          <div class="saved-wrap">
            <button id="saved-button" class="quiet-button saved-toggle" type="button" aria-haspopup="true" aria-expanded="false" title="Saved topics"><span aria-hidden="true">☆</span> <span id="saved-count">0</span></button>
            <div id="saved-popover" class="popover" hidden>
              <p class="eyebrow">Saved topics</p>
              <div id="bookmarked-topics" class="bookmarked-topics"><span class="saved-empty">Nothing saved yet. Use ☆ on a lesson.</span></div>
            </div>
          </div>
          <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch between dark and light" title="Switch between dark and light">◐</button>
        </div>
      </header>

      <main class="workspace" id="workspace">
        <section id="map" class="map-pane" aria-label="Topic map">
          <div class="map-header">
            <nav id="trail" class="trail" aria-label="Path you followed"></nav>
            <div class="map-actions">
              <button id="back-button" class="quiet-button" type="button" disabled title="Previous topic"><span aria-hidden="true">←</span> Back</button>
              <button id="home-button" class="quiet-button" type="button" title="Back to Ethereum RPC"><span aria-hidden="true">⌂</span> Home</button>
              <button id="zoom-out" class="quiet-button zoom-button" type="button" aria-label="Zoom out" title="Zoom out">−</button>
              <button id="zoom-in" class="quiet-button zoom-button" type="button" aria-label="Zoom in" title="Zoom in">+</button>
              <button id="fit-button" class="quiet-button" type="button" title="Fit the map to the pane"><span aria-hidden="true">⌗</span> Fit</button>
            </div>
          </div>
          <div id="graph-wrap" class="graph-wrap" aria-label="Interactive Ethereum RPC knowledge graph">
            <svg id="graph-lines" class="graph-lines" aria-hidden="true"></svg>
            <div id="graph-nodes" class="graph-nodes"></div>
            <div id="legend" class="legend" aria-label="Categories"></div>
            <div class="graph-hint" id="graph-hint"><span class="hint-dot"></span> Click a term to open it · drag to pan · scroll to zoom</div>
            <div id="load-state" class="load-state">Loading the map…</div>
          </div>
        </section>

        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the lesson column. Use the left and right arrow keys to adjust." tabindex="0" title="Drag to resize"></div>

        <section id="lesson" class="lesson-pane" tabindex="-1" aria-live="polite">
          <article id="lesson-content" class="lesson" hidden>
            <header class="lesson-head">
              <div class="lesson-topline">
                <button id="lesson-category" class="category-pill" type="button" title="Open this category"></button>
                <span id="lesson-meta" class="lesson-meta"></span>
                <span class="lesson-spacer"></span>
                <button id="bookmark-button" class="bookmark-button" type="button" aria-label="Save this topic" title="Save this topic">☆</button>
              </div>
              <h2 id="lesson-title"></h2>
              <p id="lesson-summary" class="lesson-summary"></p>
            </header>
            <div class="lesson-grid">
              <div id="lesson-body" class="lesson-body"></div>
              <aside class="lesson-side">
                <section class="side-block">
                  <p class="eyebrow">Terms in this lesson</p>
                  <div id="lesson-terms" class="term-list"></div>
                </section>
                <section class="side-block">
                  <p class="eyebrow">Read next</p>
                  <div id="related-topics" class="related-topics"></div>
                </section>
                <section class="side-block" id="sources-block" hidden>
                  <p class="eyebrow">Primary references</p>
                  <div id="topic-sources" class="topic-sources"></div>
                </section>
              </aside>
            </div>
            <div class="learn-block">
              <button id="learned-button" class="learned-button" type="button"><span aria-hidden="true">◆</span> Take the checkpoint</button>
              <button id="learned-reset" class="text-button" type="button" hidden>Mark as not learned</button>
            </div>
          </article>

          <article id="category-content" class="lesson category-lesson" hidden>
            <header class="lesson-head">
              <div class="lesson-topline"><span class="category-pill" id="category-pill">Category</span><span id="category-meta" class="lesson-meta"></span></div>
              <h2 id="category-title"></h2>
              <p id="category-blurb" class="lesson-summary"></p>
            </header>
            <div id="category-topics" class="category-topics"></div>
          </article>
        </section>
      </main>
    </div>
    <div id="quiz-overlay" class="quiz-overlay" hidden>
      <div id="quiz-card" class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quiz-heading">
        <header class="quiz-head">
          <div>
            <p class="eyebrow" id="quiz-step">Checkpoint</p>
            <h3 id="quiz-heading"></h3>
          </div>
          <button id="quiz-close" class="icon-button" type="button" aria-label="Close the checkpoint" title="Close">×</button>
        </header>
        <div id="quiz-progress" class="quiz-progress" aria-hidden="true"></div>
        <div id="quiz-body" class="quiz-body" aria-live="polite"></div>
        <footer id="quiz-footer" class="quiz-footer"></footer>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
